name: Build OGKBlur DLL
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar DLL com MSBuild
        run: |
          $sdk = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Where-Object { $_.Name -match "^10\." } | Sort-Object Name -Descending | Select-Object -First 1).Name
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          & $msbuild "build\windows\AddSubtract.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=$sdk /p:PlatformToolset=v143
      - name: Empacotar DLL
        uses: actions/upload-artifact@v4
        with:
          name: OGKBlur-Plugin-Resolume
          path: "**/*AddSubtract*.dll"
